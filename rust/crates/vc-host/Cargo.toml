[package]
name = "vc-host"
default-run = "VirtualCapture"
autobins = false
description = "VirtualCapture 统一入口：GPUI 接收、采集后台与隔离能力探测"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "VirtualCapture"
path = "src/main.rs"

[dependencies]
vc-core.workspace = true
vc-capture = { path = "../vc-capture" }
vc-media = { path = "../vc-media" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
