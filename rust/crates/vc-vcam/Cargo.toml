[package]
name = "vc-vcam"
description = "VirtualCapture DirectShow source filter (NV12, SHM v3) as a native Rust COM DLL"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "vc_vcam"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vc-vcam-diag"
path = "src/bin/vc_vcam_diag.rs"

[[bin]]
name = "vc-vcam-verify"
path = "src/bin/vc_vcam_verify.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
