[workspace]
resolver = "3"
members = [
    "crates/vc-core",
    "crates/vc-capture",
    "crates/vc-host",
    "crates/vc-updater",
    "crates/vc-transport",
    "crates/vc-stream",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
publish = false

[workspace.dependencies]
vc-core = { path = "crates/vc-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs", "io-util"] }
http-body-util = "0.1"
sha2 = "0.10"
hex = "0.4"
# 仅解压发布包；关闭默认特性避免引入 bzip2/zstd 等未使用后端。
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# gpui-kit 固定依赖 gpui-pre 0.3.12（zed@d2a4fb6 快照）与 gpui-component 0.9.1，须整体升级。
gpui-kit = "0.9.1"

[profile.release]
lto = "thin"
codegen-units = 4
